<section class="projects" id="projects">
  <div class="container">
    <div class="section-header">
      <span class="section-label">My Work</span>
      <h2 class="section-title">Featured Projects</h2>
      <p class="section-subtitle">A selection of things I've built — from side projects to full-scale applications.</p>
    </div>

    <div class="projects-grid">
      @for (project of projects; track project.id) {
        <div class="project-card" [class.featured]="project.featured">
          <div class="project-top">
            <div class="project-icon">
              {{ project.featured ? '⭐' : '📁' }}
            </div>
            <a [href]="project.link" class="project-link" title="View project">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
            </a>
          </div>

          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-desc">{{ project.description }}</p>

          <div class="project-tags">
            @for (tag of project.tags; track tag) {
              <span class="tag">{{ tag }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
