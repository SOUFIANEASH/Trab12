<section class="skills" id="skills">
  <div class="container">
    <div class="section-header">
      <span class="section-label">My Expertise</span>
      <h2 class="section-title">Skills & Technologies</h2>
      <p class="section-subtitle">Technologies and skills I've developed throughout my studies and projects.</p>
    </div>

    <div class="category-tabs">
      @for (cat of categories; track cat.key) {
        <button
          class="tab"
          [class.active]="activeCategory === cat.key"
          (click)="setCategory(cat.key)">
          {{ cat.label }}
        </button>
      }
    </div>

    <div class="skills-grid">
      @for (skill of filteredSkills; track skill.name) {
        <div class="skill-card">
          <div class="skill-header">
            <span class="skill-name">{{ skill.name }}</span>
            <span class="skill-percent">{{ skill.level }}%</span>
          </div>
          <div class="skill-bar">
            <div class="skill-fill" [style.width]="getWidth(skill.level)"></div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
