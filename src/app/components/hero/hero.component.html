<section class="hero" id="home">
  <div class="hero-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <div class="hero-content">
      <span class="availability-badge">
        <span class="dot"></span>
        Available for work
      </span>

      <h1 class="hero-title">
        Hi, I'm <span class="highlight">{{ name }}</span>
      </h1>

      <h2 class="hero-role">{{ role }}</h2>

      <p class="hero-tagline">{{ tagline }}</p>

      <div class="hero-actions">
        <a href="#projects" class="btn-primary">View My Work</a>
        <a href="#contact" class="btn-outline">Get In Touch</a>
      </div>

      <div class="hero-stats">
        <div class="stat">
          <span class="stat-value">3+</span>
          <span class="stat-label">Projects Built</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value">4</span>
          <span class="stat-label">Languages Spoken</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value">B2</span>
          <span class="stat-label">English & French</span>
        </div>
      </div>
    </div>

    <div class="hero-avatar">
      <div class="avatar-frame">
        <div class="avatar-inner">
          <span class="avatar-initials">SA</span>
        </div>
        <div class="avatar-ring ring-1"></div>
        <div class="avatar-ring ring-2"></div>
      </div>
    </div>
  </div>
</section>
